<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriTrack - Smart Nutrition & Diet Tracker</title>
    <meta name="description" content="Elevated clinical-wellness nutrition and metabolic tracking with barcode scanning, daily food diary, and macronutrient targets." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-dim": "#d0dbed",

              "on-primary-container": "#86af99",
              "tertiary-fixed": "#cee9d3",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#eff4ff",
              "secondary-fixed": "#92f7c3",
              "outline": "#717973",
              "on-tertiary-fixed": "#092012",
              "on-surface-variant": "#414844",
              "on-secondary-fixed-variant": "#005235",
              "on-secondary": "#ffffff",
              "inverse-on-surface": "#eaf1ff",
              "background": "#f8f9ff",
              "on-primary": "#ffffff",
              "on-background": "#121c2a",
              "error": "#ba1a1a",
              "secondary-fixed-dim": "#75daa8",
              "secondary": "#006c48",
              "outline-variant": "#c1c8c2",
              "tertiary-fixed-dim": "#b3cdb7",
              "surface-tint": "#3f6653",
              "primary": "#012d1d",
              "error-container": "#ffdad6",
              "primary-container": "#1b4332",
              "on-secondary-fixed": "#002113",
              "primary-fixed-dim": "#a5d0b9",
              "on-tertiary-container": "#93ad98",
              "on-primary-fixed-variant": "#274e3d",
              "surface-container": "#e6eeff",
              "on-secondary-container": "#00734d",
              "surface-variant": "#d9e3f6",
              "on-error": "#ffffff",
              "surface-container-highest": "#d9e3f6",
              "tertiary-container": "#2a4131",
              "on-error-container": "#93000a",
              "tertiary": "#152b1c",
              "surface": "#f8f9ff"
            },
            borderRadius: {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "full": "9999px"
            },
            spacing: {
              "gutter": "1.5rem",
              "margin": "2rem",
              "space-md": "1rem",
              "gutter-mobile": "1rem",

              "space-sm": "0.5rem",
              "margin-mobile": "1rem",
              "space-lg": "1.5rem",
              "space-xl": "2.5rem"
            },
            fontFamily: {
              "title": ["Manrope", "sans-serif"],
              "label-caps": ["Hanken Grotesk", "sans-serif"],
              "headline-sm": ["Manrope", "sans-serif"],
              "body-lg": ["Hanken Grotesk", "sans-serif"],
              "label-md": ["Hanken Grotesk", "sans-serif"],

              "body-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }],
              "headline-lg": ["36px", { lineHeight: "44px", fontWeight: "700" }],
              "label-lg": ["14px", { lineHeight: "20px", fontWeight: "600" }],

        }
      };
    </script>
    <style>
      @layer base {
        html, body {
          margin: 0;
          padding: 0;
          background-color: #f8f9ff;
          color: #121c2a;
          font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
      }
      .font-manrope { font-family: 'Manrope', sans-serif; }
      .font-hanken { font-family: 'Hanken Grotesk', sans-serif; }
      
      @keyframes scanline {
        0% { top: 16%; opacity: 0.1; }
        15% { opacity: 0.95; }
        85% { opacity: 0.95; }
        100% { top: 84%; opacity: 0.1; }
      }
      .animate-scanline {
        animation: scanline 2.8s ease-in-out infinite;
      }
      
      /* Custom thin scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(113, 121, 115, 0.25);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(113, 121, 115, 0.45);
      }
    </style>
  </head>
  <body class="bg-background font-body-md text-on-surface antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
